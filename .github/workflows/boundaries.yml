# Enforces the database access boundary (eslint.boundaries.mjs): nothing in this
# repo may import @arlink28/db / @prisma/client; data comes from the C# API.
# Separate from Packages CI because it must also run when only apps/web changes.
name: Boundaries

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "eslint.boundaries.mjs"
      - "eslint.boundaries.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/boundaries.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "eslint.boundaries.mjs"
      - "eslint.boundaries.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/boundaries.yml"

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager" (pnpm@12.6.0).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No database access outside the C# API
        run: pnpm lint:boundaries
